# clagentic-lite — Codex CLI config
#
# NOT AUTO-LOADED (lr-ae403d audit, follow-up to lr-2ec7b5). Confirmed via
# codex-cli 0.142.5: `codex --help`/`codex exec --help`/`codex mcp --help`
# describe `-c`/`--config`, `--ignore-user-config`, and `--profile` entirely
# in terms of `~/.codex/config.toml` ($CODEX_HOME) -- never a project-local
# `.codex/` directory. Definitive: `codex doctor --json`, run with
# cwd=<this repo, which HAS this file>, reports
# checks.config\.load.details["config.toml"] = "~/.codex/config.toml" (the
# GLOBAL path) and no reference to this file at all. `invoke_codex`
# (scripts/llm-client.sh) also never passes `-c`/`--config`/`-p`/`--profile`
# pointing at this file, and passes `--skip-git-repo-check` -- confirming
# from both sides (binary behavior AND caller code) that nothing reads this
# file today.
#
# lr-2ec7b5 already established this for the (now-removed) `prompt_file`
# field alone; this audit generalizes the finding to the WHOLE file: every
# field below (approval, sandbox, network, roles.*, mcp_servers, telemetry)
# is equally dead from this repo's own invocation path. The actual
# equivalent of `[[roles.list]] permissions/tier` restriction lives in code
# instead -- `invoke_codex`'s `--disable shell_tool -s read-only` flags,
# gated by `ds_llm_role_is_bash_unrestricted` (scripts/platform.sh) -- see
# that function's doc comment and AGENTS.md INV-5.
#
# KEPT (not deleted) as operator-facing documentation of the INTENDED
# sandbox/role posture for anyone running `codex` interactively from this
# repo outside clagentic-lite's own invocation path (a human session can
# reference or `-c`-override these values manually; codex itself will not
# read them automatically). If this file is ever wired to actually be read
# (e.g. `invoke_codex` starts passing `-c`/`--config`), remove this notice
# and re-verify the field-by-field behavior described in it, since none of
# it has been exercised against a real load path.

[runtime]
# Approval mode: 'required' means Codex asks before executing any write/network action.
# clagentic-lite uses Codex primarily as the Reviewer role — read-only by contract.
approval = "required"

# Sandbox: 'workspace' confines writes to this repo. Reviewer should never write at all;
# this is defense in depth.
sandbox = "workspace"

# Network: Codex needs outbound for model calls. Tool-level network access is off.
network = "model-only"

[roles]
# Default role for `codex` invocations in this repo.
# Wrapper script scripts/llm-client.sh sets specific roles per subcommand.
default = "reviewer"

[[roles.list]]
name = "reviewer"
permissions = ["read"]
# No prompt_file: the Reviewer prompt (role, JSON schema, Pre-Report Gate,
# Common False Positives) is supplied entirely by ds_review_prompt in
# scripts/llm-client.sh, piped to `codex exec -` via stdin at call time
# (invoke_codex). A prompt_file pointing at ".claude/agents/reviewer.md"
# previously sat here, but that path never exists in clagentic-lite's own
# working tree (see docs/GATES.md "Gate 3" and lr-2ec7b5) and this repo's
# own invocation path never reads prompt_file from this config at all —
# it was dead weight, not a behavior change to remove it.

[[roles.list]]
name = "auditor"
permissions = ["read"]
# No prompt_file: same rationale as reviewer above. The Auditor's
# adversarial prompt (including its own inlined Pre-Report Gate) is
# supplied by ds_adversarial_prompt in scripts/llm-client.sh.

[[roles.list]]
name = "summarizer"
permissions = ["read"]
# Cheap, fast model. Override via CLAGENTIC_SUMMARIZER_TIER.
tier = "spark"

[mcp_servers]
# Empty by design. clagentic-lite does not add MCP servers — keep the surface area small.
# Users can add their own in ~/.codex/config.toml without touching this file.

[telemetry]
# Local audit log only. No external telemetry.
local_audit_db = ".clagentic/audit.db"
