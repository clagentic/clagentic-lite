# clagentic-lite — Codex CLI config
# Loaded when Codex is invoked from this repo.

[runtime]
# Approval mode: 'required' means Codex asks before executing any write/network action.
# clagentic-lite uses Codex primarily as the Reviewer role — read-only by contract.
approval = "required"

# Sandbox: 'workspace' confines writes to this repo. Reviewer should never write at all;
# this is defense in depth.
sandbox = "workspace"

# Network: Codex needs outbound for model calls. Tool-level network access is off.
network = "model-only"

[roles]
# Default role for `codex` invocations in this repo.
# Wrapper script scripts/llm-client.sh sets specific roles per subcommand.
default = "reviewer"

[[roles.list]]
name = "reviewer"
permissions = ["read"]
# No prompt_file: the Reviewer prompt (role, JSON schema, Pre-Report Gate,
# Common False Positives) is supplied entirely by ds_review_prompt in
# scripts/llm-client.sh, piped to `codex exec -` via stdin at call time
# (invoke_codex). A prompt_file pointing at ".claude/agents/reviewer.md"
# previously sat here, but that path never exists in clagentic-lite's own
# working tree (see docs/GATES.md "Gate 3" and lr-2ec7b5) and this repo's
# own invocation path never reads prompt_file from this config at all —
# it was dead weight, not a behavior change to remove it.

[[roles.list]]
name = "auditor"
permissions = ["read"]
# No prompt_file: same rationale as reviewer above. The Auditor's
# adversarial prompt (including its own inlined Pre-Report Gate) is
# supplied by ds_adversarial_prompt in scripts/llm-client.sh.

[[roles.list]]
name = "summarizer"
permissions = ["read"]
# Cheap, fast model. Override via CLAGENTIC_SUMMARIZER_TIER.
tier = "spark"

[mcp_servers]
# Empty by design. clagentic-lite does not add MCP servers — keep the surface area small.
# Users can add their own in ~/.codex/config.toml without touching this file.

[telemetry]
# Local audit log only. No external telemetry.
local_audit_db = ".clagentic/audit.db"
